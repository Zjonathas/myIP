<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: NOC Dark Slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Node Gradient: Electric Blue to Vivid Cyan -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Network Bus Gradient: Cyan glow -->
    <linearGradient id="bus-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="glow-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090d18" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Background Squircle -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#bg-grad)" stroke="#3b82f6" stroke-width="8" stroke-opacity="0.5" />

  <!-- 2. Ambient Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow-ambient)" />

  <!-- 3. Network Bus Lines -->
  <!-- Top vertical feeder -->
  <path d="M 256,180 V 260" fill="none" stroke="url(#bus-grad)" stroke-width="22" stroke-linecap="round" />
  <!-- Bottom interconnecting bus -->
  <path d="M 140,325 V 260 H 372 V 325" fill="none" stroke="url(#bus-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4. Active Status Pulse at Central Junction -->
  <circle cx="256" cy="260" r="18" fill="#10b981" stroke="#34d399" stroke-width="4" />

  <!-- 5. Top Gateway Node (Server / Ingress) -->
  <g transform="translate(256, 135)">
    <rect x="-42" y="-42" width="84" height="84" rx="22" fill="url(#node-grad)" stroke="#bae6fd" stroke-width="6" />
    <circle cx="0" cy="0" r="11" fill="#ffffff" />
  </g>

  <!-- 6. Bottom-Left Client Node -->
  <g transform="translate(140, 365)">
    <rect x="-42" y="-42" width="84" height="84" rx="22" fill="url(#node-grad)" stroke="#bae6fd" stroke-width="6" />
    <circle cx="0" cy="0" r="11" fill="#ffffff" />
  </g>

  <!-- 7. Bottom-Right Client Node -->
  <g transform="translate(372, 365)">
    <rect x="-42" y="-42" width="84" height="84" rx="22" fill="url(#node-grad)" stroke="#bae6fd" stroke-width="6" />
    <circle cx="0" cy="0" r="11" fill="#ffffff" />
  </g>
</svg>
